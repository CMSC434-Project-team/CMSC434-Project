<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, initial-scale=1.0" />
    <title>Profile | Kitchen Kompanion</title>
    <meta name="description"
        content="A web application for managing your kitchen inventory, shopping lists, and recipes." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg" />
    <link rel="mask-icon" href="assets/favicons/favicon.svg" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/styles/profile.css" />

    <!-- Scripts -->
    <script src="scripts/_global.js" defer></script>
    <script src="scripts/profile.js" defer></script>
</head>

<body>
    <div class="container" data-mode="normal">
        <main id="content">
            <header>
                <button id="add-person-button" aria-label="Add person" aria-expanded="false" class="btn-solo"><span
                        role="img" aria-label="Add person" class="svg-icon icon-add"></span></button>
                <h1 class="text-lg">Profiles</h1>
            </header>
            <ul id="people-list">
            </ul>

            <form id="add-person-form" class="flex-col gap-1 no-scrollbar" novalidate>
                <header>
                    <div class="btn-group">
                        <button type="button" id="close-add-person-form" aria-label="Cancel" class="btn"><span
                                role="img" aria-label="Cancel" class="svg-icon icon-back"></span>
                        </button>
                        <button type="button" id="delete-person-button" aria-label="Delete person"
                            class="btn error hidden"><span role="img" aria-label="Delete person"
                                class="svg-icon icon-discard"></span>
                        </button>
                    </div>
                    <h1 id="person-form-title" class="text-lg">Add person</h1>
                    <button type="submit" id="save-person-button" aria-label="Save person" class="btn-solo active"><span
                            role="img" aria-label="Save person" class="svg-icon icon-check"></span>
                    </button>
                </header>

                <label for="person-name" class="text-sm">Name</label>
                <input type="text" id="person-name" name="person-name" class="text-sm" required>
                <p class="help-text text-xs">Who is this profile for?</p>

                <p class="text-sm">Dietary restrictions</p>
                <div id="tag-options" aria-label="Dietary restrictions" class="btn-group">
                    <!-- Tag checkboxes are generated by profile.js from DIETARY_LABELS (_global.js) -->
                </div>
            </form>
        </main>
        <footer>
            <div id="footer-bar" class="btn-group-wrapper">
                <nav id="group-default" class="btn-group">
                    <a href="index.html" title="Home" class="btn"><span role="img" aria-label="Home"
                            class="svg-icon icon-home"></span>
                        <p>Home</p>
                    </a>
                    <a href="shopping.html" title="Shopping List" class="btn"><span role="img"
                            aria-label="Shopping List" class="svg-icon icon-shopping"></span>
                        <p>Shopping</p>
                    </a>
                    <a href="recipes.html" title="Recipes" class="btn"><span role="img" aria-label="Recipes"
                            class="svg-icon icon-recipes"></span>
                        <p>Recipes</p>
                    </a>
                    <a href="#content" title="Profile" class="btn active"><span role="img" aria-label="Profile"
                            class="svg-icon icon-profile"></span>
                        <p>Profile</p>
                    </a>
                </nav>
            </div>
        </footer>
    </div>
</body>

</html>
