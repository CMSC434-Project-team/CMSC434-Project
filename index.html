<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, initial-scale=1.0" />
    <title>Kitchen Kompanion</title>
    <meta name="description"
        content="A web application for managing your kitchen inventory, shopping lists, and recipes." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg" />
    <link rel="mask-icon" href="assets/favicons/favicon.svg" />

    <!-- Styles -->
    <link rel="preload" href="assets/styles/index.css" as="style" />
    <link rel="stylesheet" href="assets/styles/index.css" />

    <!-- Fonts -->
    <link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" crossorigin="" type="font/woff2" />
    <script type="module" src="scripts/index.js"></script>
</head>

<body>
    <div class="container">
        <div>
            <main id="content">
                <!-- START OF MAIN CONTENT -->
                <header>
                    <h1 class="text-lg">Inventory</h1>
                    <div class="btn-group">
                        <button id="add-item-button" aria-label="Add item" aria-expanded="false" class="btn"><span
                                role="img" aria-label="Add item" class="svg-icon icon-add"></span></button>
                        <button id="edit-button" aria-label="Edit item" class="btn"><span role="img"
                                aria-label="Edit item" class="svg-icon icon-edit"></span></button>
                    </div>
                </header>
                <div id="search">
                    <span role="img" aria-label="Search" class="svg-icon icon-search"></span>
                    <input type="search" placeholder="Search..." class="text-sm" />
                </div>
                <div>
                    <ul id="inventory-list">
                        <!-- Inventory items will be added here dynamically -->
                    </ul>
                </div>
                <!-- END OF MAIN CONTENT -->

                <form id="add-item-form" class="no-scrollbar">
                    <header>
                        <h1 class="text-lg">Inventory</h1>
                        <div class="btn-group">
                            <label for="add-item-button" id="close-add-item-form" aria-label="Close form" class="btn"><span role="img"
                                    aria-label="Close form" class="svg-icon icon-close"></span></label>
                        </div>
                    </header>
                    <!-- Required fields -->
                    <label for="item-name">Item Name:</label>
                    <input type="text" id="item-name" name="item-name" required>

                    <label for="item-quantity">Quantity:</label>
                    <input type="number" id="item-quantity" name="item-quantity" min="1" required>

                    <label for="item-unit">Unit:</label>
                    <select id="item-unit" name="item-unit">
                        <option value="pcs">pcs</option>
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="l">l</option>
                        <option value="ml">ml</option>
                    </select>

                    <!-- Alerts -->
                    <label for="item-expiration">Expiration Date:</label>
                    <input type="date" id="item-expiration" name="item-expiration">
                    <p class="help-text">If the item has an expiration date, it will be highlighted when it's close
                        to
                        expiring.</p>

                    <label for="item-low-stock">Low Stock Threshold:</label>
                    <input type="number" id="item-low-stock" name="item-low-stock" min="0">
                    <p class="help-text">When stock falls below this value, an alert will be shown.</p>

                    <!-- Optional fields -->
                    <label for="item-location">Location:</label>
                    <input type="text" id="item-location" name="item-location">

                    <label for="item-tags">Tags (comma-separated):</label>
                    <input type="text" id="item-tags" name="item-tags">

                    <label for="item-notes">Notes:</label>
                    <textarea id="item-notes" name="item-notes"></textarea>

                    <button type="submit">Add Item</button>
                </form>
            </main>
            <footer>
                <div id="footer-bar" class="btn-group-wrapper">
                    <nav id="group-default" class="btn-group">
                        <a href="#content" title="Home" class="btn active"><span role="img" aria-label="Home"
                                class="svg-icon icon-home"></span>
                        </a>
                        <a href="shopping.html" title="Shopping List" class="btn"><span role="img"
                                aria-label="Shopping List" class="svg-icon icon-shopping"></span>
                        </a>
                        <a href="recipes.html" title="Recipes" class="btn"><span role="img" aria-label="Recipes"
                                class="svg-icon icon-recipes"></span>
                        </a>
                        <a href="profile.html" title="Profile" class="btn"><span role="img" aria-label="Profile"
                                class="svg-icon icon-profile"></span>
                        </a>
                    </nav>
                </div>
            </footer>
        </div>
    </div>
</body>

</html>
