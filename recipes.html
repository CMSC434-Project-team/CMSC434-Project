<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, initial-scale=1.0" />
    <title>Recipes | Kitchen Kompanion</title>

    <link rel="icon" href="assets/favicons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles/recipes.css?v=5" />

    <script src="scripts/_global.js" defer></script>
    <script src="scripts/recipes.js" defer></script>
</head>

<body>
    <div class="container">
        <main id="content">
            <section id="recipe-home">
                <header class="recipe-header">
                    <h1 class="text-lg">Recipes</h1>
                    <button id="create-button" aria-label="Add item" aria-expanded="false" class="btn-solo"><span
                            role="img" aria-label="Add item" class="svg-icon icon-add"></span></button>
                </header>

                <div class="recipe-filters">
                    <input id="recipe-search" type="search" placeholder="Search recipes or ingredients"
                        aria-label="Search recipes or ingredients" />

                    <div class="select-wrapper">
                        <select id="recipe-filter" aria-label="Recipe availability">
                            <option value="all">All recipes</option>
                            <option value="ready">Can make now</option>
                            <option value="soon">Expiring soon</option>
                            <option value="missing">Needs ingredients</option>
                        </select>
                    </div>
                </div>

                <div id="recipe-list"></div>
            </section>

            <p id="recipe-status" role="status" aria-live="polite"></p>

            <section id="recipe-details" hidden>
                <button id="back-button" type="button" class="recipe-btn">← Recipes</button>

                <h1 id="recipe-name" class="text-lg"></h1>
                <p id="recipe-time"></p>
                <p id="recipe-stock-status"></p>

                <div class="ingredient-heading">
                    <h2>Ingredients</h2>
                    <div id="recipe-inventory-controls">
                        <a id="view-shopping" href="shopping.html" class="btn-solo"><span role="img"
                                aria-label="View Shopping" class="svg-icon icon-shopping"></span></a>
                        <button id="edit-ingredients" type="button" class="btn-solo active"><span role="img"
                                aria-label="Edit inventory" class="svg-icon icon-edit"></span></button>
                        <button id="discard-ingredient-edits" type="button" hidden class="btn-solo error"><span
                                role="img" aria-label="Discard edit" class="svg-icon icon-discard"></span></button>
                        <button id="save-ingredient-edits" type="button" hidden class="btn-solo active"><span role="img"
                                aria-label="Save changes" class="svg-icon icon-check"></span></button>
                    </div>
                </div>
                <ul id="recipe-ingredients"></ul>

                <button id="add-missing" type="button" class="recipe-btn">
                    Add missing items to Shopping
                </button>

                <h2>Steps</h2>
                <ol id="recipe-steps"></ol>
            </section>

            <section id="create-recipe" hidden>
                <h1 class="text-lg">Create recipe</h1>

                <label for="new-name">Recipe name</label>
                <input id="new-name" type="text" />

                <label for="new-time">Total time (minutes)</label>
                <input id="new-time" type="number" min="1" />

                <h2>Ingredients</h2>

                <label for="ingredient-name">Ingredient name</label>
                <input id="ingredient-name" type="text" />

                <label for="ingredient-quantity">Quantity</label>
                <div class="recipe-columns">
                    <input id="ingredient-quantity" type="number" min="0.01" step="any" />
                    <div class="select-wrapper">
                        <select id="ingredient-unit" aria-label="Unit">
                            <option value="unit">unit</option>
                            <option value="pcs">pcs</option>
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="l">l</option>
                            <option value="ml">ml</option>
                            <option value="cup">cup</option>
                            <option value="tbsp">tbsp</option>
                            <option value="tsp">tsp</option>
                            <option value="can">can</option>
                            <option value="portion">portion</option>
                        </select>
                    </div>
                </div>

                <button id="add-ingredient" type="button" class="recipe-btn">
                    + Add ingredient
                </button>

                <ul id="added-ingredients"></ul>

                <label for="new-steps">
                    Instructions (one step per line)
                </label>
                <textarea id="new-steps" rows="3"></textarea>

                <div class="recipe-columns" style="margin-top: 0.5rem;">
                <button id="review-recipe" type="button" class="recipe-btn">
                    Review recipe
                </button>
                <button id="cancel-create" type="button" class="recipe-btn error">Cancel</button>
                </div>
            </section>

            <section id="recipe-review" hidden>
                <h1 class="text-lg">Review recipe</h1>
                <h2 id="review-name"></h2>

                <h2>Ingredients</h2>
                <ul id="review-ingredients"></ul>

                <h2>Steps</h2>
                <ol id="review-steps"></ol>

                <button id="edit-recipe" type="button" class="recipe-btn">
                    Back to editing
                </button>
                <button id="save-recipe" type="button" class="recipe-btn">
                    Save recipe
                </button>
            </section>
        </main>

        <footer>
            <div id="footer-bar" class="btn-group-wrapper">
                <nav id="group-default" class="btn-group">
                    <a href="index.html" title="Home" class="btn">
                        <span role="img" aria-label="Home" class="svg-icon icon-home"></span>
                        <p>Home</p>
                    </a>
                    <a href="shopping.html" title="Shopping List" class="btn">
                        <span role="img" aria-label="Shopping List" class="svg-icon icon-shopping"></span>
                        <p>Shopping</p>
                    </a>
                    <a href="#content" title="Recipes" class="btn active">
                        <span role="img" aria-label="Recipes" class="svg-icon icon-recipes"></span>
                        <p>Recipes</p>
                    </a>
                    <a href="profile.html" title="Profile" class="btn">
                        <span role="img" aria-label="Profile" class="svg-icon icon-profile"></span>
                        <p>Profile</p>
                    </a>
                </nav>
            </div>
        </footer>
    </div>
</body>

</html>
