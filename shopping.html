<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, initial-scale=1.0" />
    <title>Shopping List | Kitchen Kompanion</title>
    <meta name="description"
        content="A web application for managing your kitchen inventory, shopping lists, and recipes." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg" />
    <link rel="mask-icon" href="assets/favicons/favicon.svg" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/styles/shopping.css" />

    <!-- Scripts -->
    <script src="scripts/_global.js" defer></script>
    <script src="scripts/shopping.js" defer></script>
</head>

<body>
    <div class="container">
        <main id="content">
            <!-- START OF MAIN CONTENT -->
            <header>
                <h1 class="text">Shopping List</h1>
                <button id="clear-checked" class="clear-button">Clear All Check</button>
            </header>
            <ul id="shopping-list">
                <!-- shopping.js goes in here -->
            </ul>
            <!-- END OF MAIN CONTENT -->
        </main>
        <footer>
            <div id="footer-bar" class="btn-group-wrapper">
                <nav id="group-default" class="btn-group">
                    <a href="index.html" title="Home" class="btn"><span role="img" aria-label="Home"
                            class="svg-icon icon-home"></span>
                        <p>Home</p>
                    </a>
                    <a href="#content" title="Shopping List" class="btn active"><span role="img"
                            aria-label="Shopping List" class="svg-icon icon-shopping"></span>
                        <p>Shopping</p>
                    </a>
                    <a href="recipes.html" title="Recipes" class="btn"><span role="img" aria-label="Recipes"
                            class="svg-icon icon-recipes"></span>
                        <p>Recipes</p>
                    </a>
                    <a href="profile.html" title="Profile" class="btn"><span role="img" aria-label="Profile"
                            class="svg-icon icon-profile"></span>
                        <p>Profile</p>
                    </a>
                </nav>
                <div id="group-other" class="btn-group">
                    <button id="undo" title="Undo" class="btn">
                        <span role="img" aria-label="Undo" class="svg-icon icon-undo"></span>
                    </button>
                    <button id="redo" title="Redo" class="btn">
                        <span role="img" aria-label="Redo" class="svg-icon icon-redo"></span>
                    </button>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
