<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, initial-scale=1.0" />
    <title>Shopping List | Kitchen Kompanion</title>
    <meta name="description"
        content="A web application for managing your kitchen inventory, shopping lists, and recipes." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/favicons/favicon.svg" />
    <link rel="mask-icon" href="assets/favicons/favicon.svg" />

    <!-- Styles -->
    <link rel="stylesheet" href="assets/styles/shopping.css" />

    <!-- Scripts -->
    <script src="scripts/_global.js" defer></script>
    <script src="scripts/shopping.js" defer></script>
</head>

<body>
    <div class="container" data-mode="normal">
        <main id="content">
            <!-- START OF MAIN CONTENT -->
            <header>
                <div>
                    <button id="add-button" aria-label="Add item" aria-expanded="false" class="btn-solo"><span
                            role="img" aria-label="Add item" class="svg-icon icon-add"></span></button>
                    <div id="edit-history" class="btn-group hidden">
                        <button id="undo" title="Undo" aria-label="Undo" class="btn">
                            <span role="img" aria-label="Undo" class="svg-icon icon-undo"></span>
                        </button>
                        <button id="redo" title="Redo" aria-label="Redo" class="btn">
                            <span role="img" aria-label="Redo" class="svg-icon icon-redo"></span>
                        </button>
                    </div>
                </div>
                <h1 class="text-lg">Shopping List</h1>
                <div>
                    <button id="edit-button" aria-label="Edit items" aria-pressed="false" class="btn-solo"><span
                            role="img" aria-label="Edit item" class="svg-icon icon-discard"></span></button>
                    <button id="save-edit-button" aria-label="Save Edit" aria-pressed="false"
                        class="btn-solo active hidden"><span role="img" aria-label="Save edit"
                            class="svg-icon icon-check"></span></button>
                </div>
            </header>

            <form id="add-form" class="add-form">
                <input id="new-name" type="text" placeholder="Item" aria-label="Item name" required />
                <input id="new-qty" type="number" min="0.01" step="any" placeholder="Qty" aria-label="Quantity"
                    required />
                <div class="select-wrapper">
                    <select id="new-unit" aria-label="Unit">
                        <option value="unit">unit</option>
                        <option value="pcs">pcs</option>
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="l">l</option>
                        <option value="ml">ml</option>
                        <option value="cup">cup</option>
                        <option value="tbsp">tbsp</option>
                        <option value="tsp">tsp</option>
                        <option value="can">can</option>
                        <option value="portion">portion</option>
                        <option value="piece">piece</option>
                    </select>
                </div>
                <button type="submit" class="add-submit">Add</button>
            </form>
            <ul id="shopping-list">
                <!-- shopping.js goes in here -->
            </ul>

            <!-- END OF MAIN CONTENT -->
        </main>
        <footer>
            <div id="footer-bar" class="btn-group-wrapper">
                <nav id="group-default" class="btn-group">
                    <a href="index.html" title="Home" class="btn"><span role="img" aria-label="Home"
                            class="svg-icon icon-home"></span>
                        <p>Home</p>
                    </a>
                    <a href="#content" title="Shopping List" class="btn active"><span role="img"
                            aria-label="Shopping List" class="svg-icon icon-shopping"></span>
                        <p>Shopping</p>
                    </a>
                    <a href="recipes.html" title="Recipes" class="btn"><span role="img" aria-label="Recipes"
                            class="svg-icon icon-recipes"></span>
                        <p>Recipes</p>
                    </a>
                    <a href="profile.html" title="Profile" class="btn"><span role="img" aria-label="Profile"
                            class="svg-icon icon-profile"></span>
                        <p>Profile</p>
                    </a>
                </nav>
            </div>
        </footer>
    </div>
</body>

</html>
